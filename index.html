<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LASA Customer Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1A7A4A;
    --dark-green: #0F4D2E;
    --light-green: #E8F5EE;
    --gold: #F4C430;
    --dark: #0E1A14;
    --surface: #162B1F;
    --surface2: #1E3828;
    --text: #F0FAF4;
    --muted: #7AAF8E;
    --danger: #E05252;
    --warning: #F4A030;
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--dark-green) 0%, var(--surface) 100%);
    border-bottom: 2px solid var(--gold);
    padding: 18px 20px 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .header-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .logo { font-size: 28px; }
  .brand h1 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -0.5px; }
  .brand p { font-size: 11px; color: var(--gold); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }

  /* ── STATS BAR ── */
  .stats-bar {
    background: var(--surface);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 14px 20px;
  }
  .stats-inner { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .stat {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 12px 14px;
    border: 1px solid rgba(255,255,255,0.06);
    text-align: center;
    transition: transform 0.2s;
  }
  .stat:hover { transform: translateY(-2px); }
  .stat-val { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 800; line-height: 1; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 4px; }
  .stat.green .stat-val { color: #4ADE80; }
  .stat.gold .stat-val { color: var(--gold); }
  .stat.red .stat-val { color: var(--danger); }
  .stat.blue .stat-val { color: #60A5FA; }

  /* ── MAIN ── */
  .main { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* ── BROADCAST SECTION ── */
  .broadcast-bar {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(244,196,48,0.2);
    display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
  }
  .broadcast-bar .field { flex: 1; min-width: 160px; }
  .broadcast-bar label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: block; }
  .broadcast-bar input, .broadcast-bar select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
  }
  .broadcast-bar input:focus, .broadcast-bar select:focus { outline: none; border-color: var(--gold); }

  /* ── BUTTONS ── */
  .btn {
    border: none; border-radius: 10px; cursor: pointer;
    font-family: 'Syne', sans-serif; font-weight: 700;
    letter-spacing: 0.3px; transition: all 0.2s; display: inline-flex;
    align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn-gold { background: var(--gold); color: var(--dark); padding: 11px 20px; font-size: 13px; }
  .btn-gold:hover { background: #e6b820; transform: translateY(-1px); }
  .btn-green { background: var(--green); color: white; padding: 11px 20px; font-size: 13px; }
  .btn-green:hover { background: var(--dark-green); transform: translateY(-1px); }
  .btn-sm { padding: 7px 12px; font-size: 11px; border-radius: 7px; }
  .btn-ghost { background: rgba(255,255,255,0.06); color: var(--muted); padding: 7px 12px; font-size: 11px; border-radius: 7px; }
  .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text); }
  .btn-danger { background: rgba(224,82,82,0.15); color: var(--danger); }
  .btn-danger:hover { background: rgba(224,82,82,0.25); }

  /* ── ADD CUSTOMER ── */
  .add-section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .add-section h3 { font-family: 'Syne', sans-serif; font-size: 14px; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .add-form { display: flex; gap: 10px; flex-wrap: wrap; }
  .add-form input {
    flex: 1; min-width: 140px;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: var(--text);
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
  }
  .add-form input:focus { outline: none; border-color: var(--green); }
  .add-form input::placeholder { color: var(--muted); }

  /* ── FILTERS ── */
  .filters {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
  }
  .filter-btn {
    padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1.5px solid rgba(255,255,255,0.1);
    background: transparent; color: var(--muted); transition: all 0.2s;
    font-family: 'Syne', sans-serif;
  }
  .filter-btn.active { background: var(--green); color: white; border-color: var(--green); }
  .filter-btn:hover:not(.active) { border-color: var(--green); color: var(--text); }
  .search-box {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    color: var(--text);
    padding: 7px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    width: 180px;
  }
  .search-box:focus { outline: none; border-color: var(--green); }
  .search-box::placeholder { color: var(--muted); }

  /* ── CUSTOMER CARDS ── */
  .customer-grid { display: flex; flex-direction: column; gap: 10px; }

  .customer-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
    border: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 12px;
    transition: all 0.2s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .customer-card:hover { border-color: rgba(26,122,74,0.4); background: var(--surface2); }

  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 800;
    flex-shrink: 0;
  }
  .avatar.ordered { background: rgba(74,222,128,0.15); color: #4ADE80; border: 2px solid rgba(74,222,128,0.3); }
  .avatar.viewing { background: rgba(244,196,48,0.15); color: var(--gold); border: 2px solid rgba(244,196,48,0.3); }
  .avatar.new { background: rgba(96,165,250,0.15); color: #60A5FA; border: 2px solid rgba(96,165,250,0.3); }

  .customer-info { flex: 1; min-width: 0; }
  .customer-name { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); }
  .customer-phone { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .customer-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .meta-item { display: flex; align-items: center; gap: 3px; }

  .status-badge {
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    font-family: 'Syne', sans-serif; letter-spacing: 0.3px; flex-shrink: 0;
  }
  .badge-ordered { background: rgba(74,222,128,0.15); color: #4ADE80; }
  .badge-viewing { background: rgba(244,196,48,0.15); color: var(--gold); }
  .badge-new { background: rgba(96,165,250,0.15); color: #60A5FA; }

  .card-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center; padding: 50px 20px;
    color: var(--muted);
  }
  .empty .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty h3 { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text); margin-bottom: 8px; }
  .empty p { font-size: 14px; line-height: 1.6; }

  /* ── BROADCAST LOG ── */
  .section-title {
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 12px; margin-top: 24px; display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.06); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border-radius: 20px; padding: 24px;
    width: 100%; max-width: 420px;
    border: 1px solid rgba(255,255,255,0.1);
    transform: translateY(20px); transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal h2 { font-family: 'Syne', sans-serif; font-size: 18px; margin-bottom: 16px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; display: block; }
  .modal-field input, .modal-field textarea, .modal-field select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: var(--text);
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif; font-size: 14px;
  }
  .modal-field textarea { resize: vertical; min-height: 80px; }
  .modal-field input:focus, .modal-field textarea:focus, .modal-field select:focus { outline: none; border-color: var(--green); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* ── WHATSAPP BUTTON ── */
  .btn-wa { background: #25D366; color: white; }
  .btn-wa:hover { background: #20b857; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 24px; right: 20px;
    background: var(--green); color: white;
    padding: 12px 20px; border-radius: 12px;
    font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transform: translateY(80px); transition: transform 0.3s;
    z-index: 300;
  }
  .toast.show { transform: translateY(0); }

  /* ── CONVERSION BAR ── */
  .conv-bar { background: var(--surface2); border-radius: 8px; height: 8px; overflow: hidden; margin-top: 8px; }
  .conv-fill { height: 100%; background: linear-gradient(90deg, var(--green), #4ADE80); border-radius: 8px; transition: width 0.6s ease; }

  @media (max-width: 600px) {
    .stats-inner { grid-template-columns: repeat(2, 1fr); }
    .card-actions { display: none; }
    .customer-card { position: relative; }
    .customer-card:active .card-actions { display: flex; }
    .search-box { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🍗</div>
    <div class="brand">
      <h1>LASA Customer Tracker</h1>
      <p>Broadcast · Convert · Retain</p>
    </div>
  </div>
</header>

<div class="stats-bar">
  <div class="stats-inner">
    <div class="stat green">
      <div class="stat-val" id="stat-ordered">0</div>
      <div class="stat-label">Ordered</div>
    </div>
    <div class="stat gold">
      <div class="stat-val" id="stat-viewing">0</div>
      <div class="stat-label">Viewing Only</div>
    </div>
    <div class="stat blue">
      <div class="stat-val" id="stat-total">0</div>
      <div class="stat-label">Total Contacts</div>
    </div>
    <div class="stat red">
      <div class="stat-val" id="stat-rate">0%</div>
      <div class="stat-label">Conversion</div>
    </div>
  </div>
</div>

<div class="main">

  <!-- Broadcast Bar -->
  <div class="broadcast-bar">
    <div class="field">
      <label>Broadcast Name</label>
      <input type="text" id="bc-name" placeholder="e.g. Friday Special – 6 June">
    </div>
    <div class="field" style="max-width:150px">
      <label>Date</label>
      <input type="date" id="bc-date">
    </div>
    <button class="btn btn-gold" onclick="newBroadcast()">📢 New Broadcast</button>
  </div>

  <!-- Add Customer -->
  <div class="add-section">
    <h3>➕ Add Contact to Broadcast List</h3>
    <div class="add-form">
      <input type="text" id="new-name" placeholder="Full name e.g. Thabo Mokoena">
      <input type="tel" id="new-phone" placeholder="WhatsApp number e.g. 0731234567">
      <input type="text" id="new-area" placeholder="Area e.g. Postdene">
      <button class="btn btn-green" onclick="addCustomer()">Add Contact</button>
    </div>
  </div>

  <!-- Conversion Progress -->
  <div id="conv-section" style="display:none; background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:20px; border:1px solid rgba(255,255,255,0.06);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <span style="font-family:'Syne',sans-serif; font-size:13px; font-weight:700;">Broadcast Conversion Rate</span>
      <span id="conv-text" style="font-family:'Syne',sans-serif; font-size:13px; color:var(--gold); font-weight:800;">0%</span>
    </div>
    <div class="conv-bar"><div class="conv-fill" id="conv-fill" style="width:0%"></div></div>
    <div style="font-size:11px; color:var(--muted); margin-top:6px;">Target: 10%+ means your broadcast is working well</div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('ordered', this)">✅ Ordered</button>
    <button class="filter-btn" onclick="setFilter('viewing', this)">👁 Viewing Only</button>
    <button class="filter-btn" onclick="setFilter('new', this)">🆕 New</button>
    <input type="text" class="search-box" id="search" placeholder="🔍 Search name or area..." oninput="renderList()">
  </div>

  <!-- Customer List -->
  <div class="customer-grid" id="customer-list"></div>

  <!-- Bulk Actions -->
  <div id="bulk-section" style="display:none; margin-top:20px;">
    <div class="section-title">Bulk Actions for Non-Buyers</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn btn-gold btn-sm" onclick="bulkWhatsApp()">💬 Message All Non-Buyers</button>
      <button class="btn btn-ghost btn-sm" onclick="bulkSpecial()">🎁 Send Special Offer to Non-Buyers</button>
    </div>
  </div>

</div>

<!-- Follow-up Modal -->
<div class="modal-overlay" id="followup-modal">
  <div class="modal">
    <h2>💬 Follow-Up Message</h2>
    <div class="modal-field">
      <label>Sending to</label>
      <input type="text" id="modal-name" readonly>
    </div>
    <div class="modal-field">
      <label>WhatsApp Number</label>
      <input type="tel" id="modal-phone" readonly>
    </div>
    <div class="modal-field">
      <label>Message</label>
      <textarea id="modal-msg" rows="5"></textarea>
    </div>
    <div class="modal-field">
      <label>Update Status After Sending</label>
      <select id="modal-status">
        <option value="">— no change —</option>
        <option value="ordered">✅ They Ordered!</option>
        <option value="viewing">👁 Still Viewing Only</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-wa" onclick="sendWhatsApp()">📲 Open WhatsApp</button>
      <button class="btn btn-green" onclick="saveStatus()">Save</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
let customers = JSON.parse(localStorage.getItem('lasa_customers') || '[]');
let currentFilter = 'all';
let currentCustomer = null;

function save() {
  localStorage.setItem('lasa_customers', JSON.stringify(customers));
}

// ── SEED DATA ─────────────────────────────────────────────────────────────────
if (customers.length === 0) {
  const names = [
    ['Thabo Mokoena','0731234501','Postdene','ordered'],
    ['Nomsa Dlamini','0761234502','Postdene','viewing'],
    ['Sipho Nkosi','0721234503','Town','viewing'],
    ['Lerato Sithole','0731234504','Kathu Rd','ordered'],
    ['Bongani Zulu','0761234505','Postdene','new'],
    ['Thandeka Mthembu','0731234506','Khumalo','viewing'],
  ];
  names.forEach(([name, phone, area, status]) => {
    customers.push({ id: Date.now() + Math.random(), name, phone, area, status, orders: status === 'ordered' ? 1 : 0, lastContact: '', notes: '', added: new Date().toISOString() });
  });
  save();
}

// ── BROADCAST ────────────────────────────────────────────────────────────────
function newBroadcast() {
  const name = document.getElementById('bc-name').value.trim();
  if (!name) { showToast('Enter a broadcast name first'); return; }
  // Reset all to "viewing" for new broadcast tracking
  customers.forEach(c => { if (c.status === 'ordered') c.status = 'ordered'; else c.status = 'viewing'; });
  save();
  renderList();
  showToast(`📢 Broadcast "${name}" started! Now mark who orders.`);
}

// ── ADD CUSTOMER ─────────────────────────────────────────────────────────────
function addCustomer() {
  const name  = document.getElementById('new-name').value.trim();
  const phone = document.getElementById('new-phone').value.trim();
  const area  = document.getElementById('new-area').value.trim();
  if (!name || !phone) { showToast('Name and phone are required'); return; }
  customers.push({ id: Date.now(), name, phone, area, status: 'new', orders: 0, lastContact: '', notes: '', added: new Date().toISOString() });
  save();
  document.getElementById('new-name').value = '';
  document.getElementById('new-phone').value = '';
  document.getElementById('new-area').value = '';
  renderList();
  showToast(`✅ ${name} added to your broadcast list`);
}

// ── FILTER ───────────────────────────────────────────────────────────────────
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderList() {
  const search = document.getElementById('search').value.toLowerCase();
  let list = customers.filter(c => {
    const matchFilter = currentFilter === 'all' || c.status === currentFilter;
    const matchSearch = !search || c.name.toLowerCase().includes(search) || (c.area||'').toLowerCase().includes(search);
    return matchFilter && matchSearch;
  });

  const ordered = customers.filter(c => c.status === 'ordered').length;
  const viewing = customers.filter(c => c.status === 'viewing').length;
  const total   = customers.length;
  const rate    = total > 0 ? Math.round((ordered / total) * 100) : 0;

  document.getElementById('stat-ordered').textContent = ordered;
  document.getElementById('stat-viewing').textContent = viewing;
  document.getElementById('stat-total').textContent   = total;
  document.getElementById('stat-rate').textContent    = rate + '%';

  // Conversion bar
  const convSec = document.getElementById('conv-section');
  if (total > 0) {
    convSec.style.display = 'block';
    document.getElementById('conv-text').textContent = rate + '%';
    document.getElementById('conv-fill').style.width = Math.min(rate, 100) + '%';
  }

  // Bulk section
  document.getElementById('bulk-section').style.display = viewing > 0 ? 'block' : 'none';

  const el = document.getElementById('customer-list');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty">
      <div class="emoji">${currentFilter === 'ordered' ? '🎉' : currentFilter === 'viewing' ? '👁' : '👥'}</div>
      <h3>${search ? 'No results found' : 'No customers here yet'}</h3>
      <p>${search ? 'Try a different search term' : 'Add contacts above to start tracking'}</p>
    </div>`;
    return;
  }

  el.innerHTML = list.map(c => {
    const initials = c.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
    const avatarClass = c.status === 'ordered' ? 'ordered' : c.status === 'viewing' ? 'viewing' : 'new';
    const badgeClass = c.status === 'ordered' ? 'badge-ordered' : c.status === 'viewing' ? 'badge-viewing' : 'badge-new';
    const badgeText = c.status === 'ordered' ? '✅ Ordered' : c.status === 'viewing' ? '👁 Viewing' : '🆕 New';
    return `
    <div class="customer-card">
      <div class="avatar ${avatarClass}">${initials}</div>
      <div class="customer-info">
        <div class="customer-name">${c.name}</div>
        <div class="customer-phone">📱 ${c.phone}${c.area ? ' · 📍 ' + c.area : ''}</div>
        <div class="customer-meta">
          <span class="meta-item">🛍 ${c.orders} order${c.orders !== 1 ? 's' : ''}</span>
          ${c.lastContact ? `<span class="meta-item">💬 Last: ${c.lastContact}</span>` : ''}
          ${c.notes ? `<span class="meta-item">📝 ${c.notes}</span>` : ''}
        </div>
      </div>
      <span class="status-badge ${badgeClass}">${badgeText}</span>
      <div class="card-actions">
        ${c.status !== 'ordered' ? `<button class="btn btn-green btn-sm" onclick="markOrdered('${c.id}')">✅ Ordered</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="openFollowUp('${c.id}')">💬</button>
        <button class="btn btn-danger btn-sm" onclick="deleteCustomer('${c.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function markOrdered(id) {
  const c = customers.find(x => x.id == id);
  if (!c) return;
  c.status = 'ordered';
  c.orders = (c.orders || 0) + 1;
  c.lastContact = new Date().toLocaleDateString('en-ZA');
  save(); renderList();
  showToast(`🎉 ${c.name} marked as ordered!`);
}

function deleteCustomer(id) {
  const c = customers.find(x => x.id == id);
  if (!confirm(`Remove ${c?.name} from your list?`)) return;
  customers = customers.filter(x => x.id != id);
  save(); renderList();
  showToast('Contact removed');
}

function openFollowUp(id) {
  const c = customers.find(x => x.id == id);
  if (!c) return;
  currentCustomer = c;
  document.getElementById('modal-name').value  = c.name;
  document.getElementById('modal-phone').value = c.phone;
  document.getElementById('modal-status').value = '';

  // Pre-fill message based on status
  let msg = '';
  if (c.status === 'viewing') {
    msg = `Hi ${c.name.split(' ')[0]} 👋\n\nI noticed you haven't placed an order yet. 🍗\n\nThis week at LASA we have:\n• Braai Chicken — R85\n• Kota — R45\n• Chips & Russian — R30\n\nPre-orders close Friday 4pm. Collection in Postdene from 6pm.\n\nReply to this message to order! 🙏\n— LASA Serving Enterprise`;
  } else if (c.status === 'ordered') {
    msg = `Hi ${c.name.split(' ')[0]} 😊\n\nThank you for your support! We hope you enjoyed your LASA order. 🍗\n\nThis week's special is available — reply to pre-order before Friday 4pm!\n\n— LASA Serving Enterprise`;
  } else {
    msg = `Hi ${c.name.split(' ')[0]} 👋\n\nWelcome to LASA Serving Enterprise! 🍗\n\nWe sell:\n• Braai Chicken — R85\n• Inhloko with Pap — R75\n• Kota — R45\n• Chips — R25\n• Russian — R30\n\nOrder via WhatsApp — collection in Postdene, Postmasburg.\n\nReply to order! 🙏\n— LASA`;
  }
  document.getElementById('modal-msg').value = msg;
  document.getElementById('followup-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('followup-modal').classList.remove('open');
  currentCustomer = null;
}

function sendWhatsApp() {
  if (!currentCustomer) return;
  const msg  = encodeURIComponent(document.getElementById('modal-msg').value);
  const phone = currentCustomer.phone.replace(/\D/g,'').replace(/^0/, '27');
  currentCustomer.lastContact = new Date().toLocaleDateString('en-ZA');
  save();
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
}

function saveStatus() {
  if (!currentCustomer) return;
  const status = document.getElementById('modal-status').value;
  if (status) {
    currentCustomer.status = status;
    if (status === 'ordered') currentCustomer.orders = (currentCustomer.orders || 0) + 1;
  }
  currentCustomer.lastContact = new Date().toLocaleDateString('en-ZA');
  save(); renderList(); closeModal();
  showToast('Customer updated ✅');
}

// ── BULK ACTIONS ─────────────────────────────────────────────────────────────
function bulkWhatsApp() {
  const nonBuyers = customers.filter(c => c.status === 'viewing' || c.status === 'new');
  if (nonBuyers.length === 0) { showToast('No non-buyers to message'); return; }
  const msg = encodeURIComponent(`Hi 👋\n\nYou haven't ordered from LASA yet — and you're missing out! 🍗\n\nThis week:\n• Braai Chicken — R85\n• Kota — R45\n• Chips & Russian — R30\n\nPre-orders close Friday 4pm. Collection Postdene.\n\nReply to order! 🙏\n— LASA Serving Enterprise`);
  // Open first one, show list for rest
  const first = nonBuyers[0];
  const phone = first.phone.replace(/\D/g,'').replace(/^0/, '27');
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
  showToast(`Opened WhatsApp for ${first.name}. Do the rest one by one.`);
}

function bulkSpecial() {
  const nonBuyers = customers.filter(c => c.status === 'viewing' || c.status === 'new');
  if (nonBuyers.length === 0) { showToast('No non-buyers'); return; }
  const msg = encodeURIComponent(`Hi 👋 Special offer just for you!\n\n🎁 Order this Friday and get FREE CHIPS with any braai chicken order.\n\nThis offer is for people on my list who haven't tried LASA yet.\n\nPre-order before Friday 4pm — reply to this message!\n\n— LASA Serving Enterprise 🍗`);
  const first = nonBuyers[0];
  const phone = first.phone.replace(/\D/g,'').replace(/^0/,'27');
  window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
  showToast(`Special offer sent to ${first.name}`);
}

// ── TOAST ────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── INIT ─────────────────────────────────────────────────────────────────────
document.getElementById('bc-date').value = new Date().toISOString().split('T')[0];
document.addEventListener('click', e => {
  if (e.target === document.getElementById('followup-modal')) closeModal();
});
renderList();
</script>
</body>
</html>
